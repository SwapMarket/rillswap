<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rill demo shop (regtest)</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 960px; margin: 3rem auto; padding: 0 1rem; color: #17372f; background: #f3f8f5; }
  h1 small { font-size: .5em; color: #b4472d; font-weight: 600; margin-left: .5rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
  .card, .panel { border: 1px solid #d6e4dc; border-radius: 20px; padding: 1.5rem; background: #fff; box-shadow: 0 8px 28px #183b2d06; }
  .price { font-size: 1.3rem; font-weight: 600; } .muted { color: #667085; font-size: .9em; }
  button, .pay-link { font: inherit; padding: .65rem 1rem; border-radius: 12px; border: 1px solid #174b3b; background: #174b3b; color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
  button.secondary { background: #fff; color: #174b3b; }
  #checkout { padding: 0; border: 0; background: transparent; box-shadow: none; }
  details { margin-top: 1rem; } summary { color: #526e62; cursor: pointer; }
  label.rail { display: block; margin: .3rem 0; }
  textarea, pre { width: 100%; box-sizing: border-box; font: 12px/1.4 ui-monospace, monospace; background: #f5f7fa; border: 1px solid #d8dde6; border-radius: 6px; padding: .5rem; white-space: pre-wrap; word-break: break-all; }
  textarea { height: 6rem; }
  .status { font-weight: 600; } .paid { color: #12804a; } .waiting { color: #b07400; } .reconciliation { color: #b42318; }
  .panel { margin-top: 1.5rem; } table { width: 100%; border-collapse: collapse; } td, th { text-align: left; padding: .3rem; border-bottom: 1px solid #eef0f4; }
</style>
</head>
<body>
<h1>Rill demo shop <small>REGTEST, fake money</small></h1>
<p class="muted" id="rate"></p>

<div class="grid" id="products"></div>

<div id="checkout" hidden></div>

<div class="panel" id="order" hidden>
  <h2>Order <span id="order-id"></span>: <span class="status" id="order-status"></span></h2>
  <p id="order-summary"></p>
  <div id="order-pay"></div>
  <div id="order-acceptance"></div>
</div>

<div class="panel">
  <h2>Orders</h2>
  <table><thead><tr><th>Order</th><th>Item</th><th>Method</th><th>Amount</th><th>Status</th></tr></thead><tbody id="history"></tbody></table>
</div>

<script type="module">
import { mountRillPay } from "/rillpay.js";
const $ = (id) => document.getElementById(id);
const esc = (text) => String(text).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const catalog = await (await fetch("/api/catalog")).json();
let selected = null;
let polling = null;
let checkoutView = null;
let preparingOrder = false;
const productButtons = [];

$("rate").textContent = `Demo rates: 1 BTC = ${catalog.demoUsdPerBtc.toLocaleString()} USD, 1 fUSDC = 1 fUSDT = 1 USD, 1 XMR = ${catalog.demoUsdPerXmr} USD. ` +
  `Signed acceptances are checked against the pinned merchant key ${catalog.acceptanceKey.slice(0, 16)}...`;

for (const product of catalog.products) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h3>${esc(product.name)}</h3><div class="price">$${(product.usdCents / 100).toFixed(2)}</div>
    <div class="muted">${product.sat.toLocaleString()} sat</div><p><button>Buy</button></p>`;
  const buy = card.querySelector("button");
  buy.onclick = () => choose(product);
  productButtons.push(buy);
  $("products").append(card);
}

function choose(product) {
  if (preparingOrder) return;
  selected = product;
  checkoutView?.destroy();
  checkoutView = mountRillPay($("checkout"), { merchant: "Rill demo shop · regtest", item: product.name,
    total: `$${(product.usdCents / 100).toFixed(2)}`, methods: product.methods,
    onCancel: () => { $("checkout").hidden = true; },
    onPay: async (rail) => {
      if (preparingOrder) throw new Error("Order preparation already pending");
      preparingOrder = true; productButtons.forEach((button) => { button.disabled = true; });
      try {
        const response = await fetch("/api/orders", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ productId: product.id, rail }) });
        const order = await response.json(); if (!response.ok) throw new Error("Order could not be created");
        $("checkout").hidden = true; show(order);
      } finally {
        preparingOrder = false; productButtons.forEach((button) => { button.disabled = false; });
      }
    },
  });
  $("checkout").hidden = false;
  $("checkout").scrollIntoView({ behavior: "smooth" });
}

function instructions(order) {
  if (order.monero) {
    const terms = order.monero.terms;
    return `<p>Send exactly ${esc(order.amountLabel)} on the local Monero regtest chain to this order's subaddress
      (one or more transactions; more than the price, or anything after expiry, goes to manual reconciliation):</p>
      <textarea readonly>${esc(terms.address)}</textarea>
      <p>The dev buyer wallet (funded by the Monero miner) pays it with:</p>
      <pre>dev/devctl pay-xmr ${esc(order.id)}</pre>
      <p class="muted">${esc(terms.amountAtomic)} piconero, valid until ${new Date(terms.expiresAt * 1000).toISOString()}.
      Acceptance needs ${terms.network.confirmations} confirmations (about ${terms.network.confirmations * 2} s with the dev miner).</p>`;
  }
  if (order.native) {
    const terms = order.native.terms;
    return `<p>Pay ${esc(order.amountLabel)} on the local Anvil chain (chain id 31337). The merchant only accepts a
      transfer whose sender signed a receipt binding for this order first, so a plain wallet transfer is not enough.
      The dev buyer account (Anvil account 1, funded with one million of each token) does both steps:</p>
      <pre>dev/devctl pay-token ${esc(order.id)}</pre>
      <p class="muted">Token ${esc(terms.asset.token)}, recipient ${esc(terms.recipient)},
      ${esc(terms.amountBaseUnits)} base units (6 decimals), valid until ${new Date(terms.expiresAt * 1000).toISOString()}.
      Acceptance needs 6 local confirmations (about 12 s).</p>`;
  }
  const invoice = order.invoice ?? "";
  const copy = `<p><button class="secondary" id="copy">Copy invoice</button></p>`;
  if (order.rail === "lightning") {
    return `<p>Pay with your regtest Lightning wallet. Wallet routing fees are separate.</p>
      <p><a class="pay-link" href="lightning:${esc(invoice)}">Open Lightning wallet</a></p>
      <textarea readonly>${esc(invoice)}</textarea>${copy}
      <details><summary>Local testing command</summary><pre>dev/devctl pay ${esc(invoice)}</pre></details>`;
  }
  const swap = new URL(catalog.swapPage); swap.hash = new URLSearchParams({ invoice }).toString();
  return `<p>Pay with Bitcoin: RillSwap finds a provider quote and handles recovery in your browser. No funds move until you approve.</p>
    <p><a class="pay-link" href="${esc(swap.href)}" target="_blank" rel="noopener noreferrer">Continue in RillSwap</a></p>
    <textarea readonly>${esc(invoice)}</textarea>${copy}
    <details><summary>Local testing command</summary><pre>dev/devctl swap btc-to-ln ${esc(invoice)}</pre></details>`;
}

function show(order) {
  $("order").hidden = false;
  $("order-id").textContent = order.id;
  $("order-summary").textContent = `${order.productName}, $${(order.usdCents / 100).toFixed(2)} = ` +
    `${order.amountLabel} via ${catalog.rails[order.rail]?.label ?? order.rail}`;
  $("order-pay").innerHTML = order.status === "waiting" ? instructions(order) : "";
  $("copy")?.addEventListener("click", () => navigator.clipboard.writeText(order.invoice));
  render(order);
  clearInterval(polling);
  polling = setInterval(async () => render(await (await fetch(`/api/orders/${order.id}`)).json()), 2000);
  $("order").scrollIntoView({ behavior: "smooth" });
}

function render(order) {
  const status = $("order-status");
  status.textContent = order.status;
  status.className = `status ${order.status}`;
  if (order.status !== "waiting") { $("order-pay").innerHTML = ""; clearInterval(polling); }
  $("order-acceptance").innerHTML = order.acceptance
    ? `<p class="paid">Payment accepted. Merchant signature verified (Ed25519, pinned key).</p>
       <pre>event       ${esc(order.acceptance.eventId)}\nevidence    ${esc(order.acceptance.detail)}\naccepted at ${new Date(order.acceptance.acceptedAt * 1000).toISOString()}</pre>`
    : order.status === "paid" ? `<p class="waiting">Paid, waiting for a verifiable signed acceptance...</p>`
    : order.progress ? `<p class="muted">${esc(order.progress)}</p>` : "";
  if (order.acceptance && order.progress) $("order-acceptance").innerHTML += `<p class="reconciliation">${esc(order.progress)}</p>`;
  void history();
}

async function history() {
  const list = await (await fetch("/api/orders")).json();
  $("history").innerHTML = list.map((order) => `<tr data-id="${order.id}"><td><a href="#">${order.id}</a></td>
    <td>${esc(order.productName)}</td><td>${esc(catalog.rails[order.rail]?.label ?? order.rail)}</td>
    <td>${esc(order.amountLabel)}</td><td class="${order.status}">${order.status}</td></tr>`).join("");
  for (const row of $("history").querySelectorAll("tr")) {
    row.querySelector("a").onclick = async (event) => {
      event.preventDefault();
      show(await (await fetch(`/api/orders/${row.dataset.id}`)).json());
    };
  }
}
void history();
</script>
</body>
</html>
