[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests/python"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "D105",
  "D107",
  "D203",
  "D213",
  "EM101",
  "EM102",
  "PLR0913",
  "SLF001",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "INP001", "PLR2004", "S101"]
