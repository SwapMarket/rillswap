[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rill-crypto"
version = "0.1.0.dev0"
description = "Python binding for the RillSwap cryptographic facade"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["cffi==2.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/rill_crypto"]
