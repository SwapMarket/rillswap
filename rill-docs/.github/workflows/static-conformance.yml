name: Static specification conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-specifications:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.7'
      - name: Install hash-locked static dependencies
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements-dev.txt
      - name: Check static schemas, signatures, vectors and specs
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: .venv/bin/python -m pytest -q -m 'not bitcoin_core'
