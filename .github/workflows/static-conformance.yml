name: Static specification conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-specifications:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rill-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.7'
          cache-suffix: ${{ github.workflow }}-${{ github.job }}
      - name: Install hash-locked static dependencies
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements-dev.txt
      - name: Check static schemas, signatures, vectors and specs
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: .venv/bin/python -m pytest -q -m 'not bitcoin_core'
