name: Publish static RillSwap

# Publishes the tested static web UI on every push to main, or on demand.
# Pull requests never run this workflow, so untrusted code never gets deploy
# credentials. Local builds never publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rillswap-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rill-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - name: Install shared payment dependencies
        working-directory: rill-payments
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install frozen web dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify source and static deployment behavior
        run: |
          (cd src/vendor/rill-crypto && sha256sum -c SHA256SUMS)
          bun test unit
          bunx playwright install --with-deps chromium
          bun run test
          bun run test:pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: rill-web/tmp/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the tested mainnet and signet artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
