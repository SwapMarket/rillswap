name: Auto-retry failed component jobs

# Like joinmarket-ng, rerun failed jobs (including tests) once. The original
# failure stays in attempt history; a failed second attempt is left failed.
# Publishing and deployment workflows are deliberately excluded.
on:
  workflow_run:
    workflows:
      - Component source checks
    types:
      - completed

permissions: {}

concurrency:
  group: auto-retry-component-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun-failed:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # No checkout, artifacts, or untrusted code in this privileged workflow.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          # Never repeat a rerun POST whose result might be ambiguous.
          retries: 0
          script: |
            const source = context.payload.workflow_run;
            if (!source || source.conclusion !== 'failure' || source.run_attempt !== 1 ||
                !Number.isSafeInteger(source.id) || source.id <= 0) {
              return;
            }
            const scope = { ...context.repo, run_id: source.id };
            const { data: current } = await github.rest.actions.getWorkflowRun(scope);
            // A duplicate event or manual rerun may have already advanced this run.
            if (current.id !== source.id || current.status !== 'completed' ||
                current.conclusion !== 'failure' || current.run_attempt !== 1) {
              return;
            }
            await github.rest.actions.reRunWorkflowFailedJobs(scope);
            core.info(`Requested one failed-job retry for run ${source.id}.`);
