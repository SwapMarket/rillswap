name: Component source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rill-contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - name: Install frozen contract toolchain without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check the vendored contract artifact is fresh
        run: bun run check
  payments:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rill-payments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - name: Install frozen checkout dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check checkout contracts and offline behavior
        run: |
          bun run check:schemas
          bun run check:sandbox-fixture
          bun examples/demo-shop/generate-stablecoin.ts --check
          bun run typecheck
          bun run test
          bun run build:sdk
          bun run build:native-sdk
          bun run build:rillpay
      - name: Install pinned Chromium for checkout persistence tests
        run: bunx playwright install --with-deps chromium
      - name: Check native checkout cross-tab and reopen behavior
        run: bun run test:browser
      - name: Check actual HTTPS merchant admission with default browser transport
        run: |
          RILLSWAP_RUN_MERCHANT_BROWSER=1 bun test tests/regtestMerchantHttpsDiagnostic.test.ts \
            -t 'default browser reads actual merchant HTTPS'

  woocommerce-conformance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rill-payments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - name: Install frozen checkout dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check real disposable WooCommerce price admission over verified HTTPS
        run: bun run test:woocommerce

  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rill-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.7'
      - name: Install locked Core test dependencies
        run: |
          mkdir -p tmp
          sed '/^-e /d' requirements-dev.txt > tmp/requirements-ci.txt
          uv venv --python 3.14 tmp/ci-venv
          uv pip install --python tmp/ci-venv/bin/python --require-hashes -r tmp/requirements-ci.txt
      - name: Check Core types, style and offline protocol behavior
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: packages/core/src
        run: |
          tmp/ci-venv/bin/ruff check packages/core/src tests
          tmp/ci-venv/bin/mypy packages/core/src
          tmp/ci-venv/bin/python -m pytest -q -m 'not native_crypto' --basetemp=tmp/pytest-ci

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rill-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - name: Install frozen web dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build and test disconnected browser source
        run: |
          (cd src/vendor/rill-crypto && sha256sum -c SHA256SUMS)
          bun run build
          bun test unit
      - name: Install matching Chromium for pinned Playwright
        run: bunx playwright install --with-deps chromium
      - name: Check disconnected browser behavior
        run: bun run test
      - name: Check assembled mainnet and signet Pages sites (no deployment)
        run: bun run test:pages
      - name: Check ZIP and extracted Pages candidate match tested bytes (no deployment)
        run: |
          python3 scripts/test_release_bundle.py
          python3 scripts/check_release_bundle.py dist tmp/release tmp/pages-candidate

  crypto:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rill-crypto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.7'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - name: Build and check pinned native cryptography
        run: |
          cmake -S . -B tmp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build tmp/build --parallel 2
          ctest --test-dir tmp/build --output-on-failure
      - name: Install hash-locked Python test dependencies
        run: |
          sed '/^-e /d' requirements-dev.txt > tmp/requirements-ci.txt
          uv venv --python 3.14 tmp/ci-venv
          uv pip install --python tmp/ci-venv/bin/python --require-hashes -r tmp/requirements-ci.txt
      - name: Test native Python binding
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: python/src
        run: |
          RILL_CRYPTO_LIBRARY="$PWD/tmp/build/librill_crypto.so" \
            tmp/ci-venv/bin/python -m pytest -q tests/python --basetemp=tmp/pytest-ci
      - name: Build pinned WASM and run signature smoke test
        run: ./scripts/test-wasm.sh
      - name: Require the web client's vendored WASM to equal this build
        run: |
          cmp tmp/wasm/rill_crypto_wasm.mjs ../rill-web/src/vendor/rill-crypto/rill_crypto_wasm.mjs
          cmp tmp/wasm/rill_crypto_wasm.wasm ../rill-web/src/vendor/rill-crypto/rill_crypto_wasm.wasm
      - name: Test typed WASM verification facade
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run typecheck
          bun run test:wasm-verify

  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rill-provider
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.7'
      - name: Install version-pinned provider development dependencies
        run: |
          mkdir -p tmp
          uv venv --python 3.14 tmp/ci-venv
          uv pip install --python tmp/ci-venv/bin/python -r requirements-dev.txt
      - name: Check provider source without opt-in backends
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: src:../rill-core/packages/core/src:../rill-crypto/python/src
        run: |
          tmp/ci-venv/bin/ruff check src tests
          tmp/ci-venv/bin/mypy src
          tmp/ci-venv/bin/python -m pytest -q \
            -m 'not native_crypto and not bitcoin_core and not lnd and not web_nip59_interop' \
            --basetemp=tmp/pytest-ci

  provider-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rill-provider
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.7'
      - name: Build checksum-pinned native crypto dependency
        run: |
          cmake -S ../rill-crypto -B tmp/native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build tmp/native --parallel 2
      - name: Install version-pinned provider development dependencies
        run: |
          uv venv --python 3.14 tmp/ci-venv
          uv pip install --python tmp/ci-venv/bin/python -r requirements-dev.txt
      - name: Check opt-in native cryptographic interoperability
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: src:../rill-core/packages/core/src:../rill-crypto/python/src
          RILLSWAP_RUN_NATIVE_CRYPTO: '1'
        run: |
          RILL_CRYPTO_LIBRARY="$PWD/tmp/native/librill_crypto.so" \
            tmp/ci-venv/bin/python -m pytest -q -m native_crypto --basetemp=tmp/pytest-ci
      - name: Check shared Core native recovery and settlement contracts
        working-directory: rill-core
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: packages/core/src:../rill-crypto/python/src
          RILLSWAP_RUN_NATIVE_CRYPTO: '1'
        run: |
          RILL_CRYPTO_LIBRARY="$PWD/../rill-provider/tmp/native/librill_crypto.so" \
            ../rill-provider/tmp/ci-venv/bin/python -m pytest -q -m native_crypto \
            --basetemp=tmp/pytest-ci-native

  provider-lnd:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rill-provider
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: src:../rill-core/packages/core/src:../rill-crypto/python/src:tests
      RILLSWAP_RUN_NATIVE_CRYPTO: '1'
      RILLSWAP_RUN_LND: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.7'
      - name: Build checksum-pinned native crypto dependency
        run: |
          cmake -S ../rill-crypto -B tmp/native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build tmp/native --parallel 2
      - name: Install sidecar-compatible provider dependencies
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt
      - name: Pull the fixtures' digest-pinned disposable backend images
        run: |
          .venv/bin/python - <<'PY'
          import subprocess
          from test_lnd_payment_pinned import CORE_IMAGE, LND_IMAGE, PYTHON_IMAGE
          for image in (CORE_IMAGE, LND_IMAGE, PYTHON_IMAGE):
              subprocess.run(["docker", "pull", image], check=True)
          PY
      - name: Check isolated real Core and LND interoperability
        run: |
          RILL_CRYPTO_LIBRARY="$PWD/tmp/native/librill_crypto.so" \
            .venv/bin/python -m pytest -q -s -m lnd --basetemp=tmp/pytest-ci-lnd
      - name: Check independent Core source observations
        run: |
          RILLSWAP_RUN_BITCOIN_CORE=1 .venv/bin/python -m pytest -q \
            tests/test_core_tx_bytes_bitcoin_core.py tests/test_core_block_transaction_pinned.py \
            --basetemp=tmp/pytest-ci-core-source
      - name: Check native funding inclusion without txindex or wallet discovery
        run: |
          RILLSWAP_RUN_BITCOIN_CORE=1 RILL_CRYPTO_LIBRARY="$PWD/tmp/native/librill_crypto.so" \
            .venv/bin/python -m pytest -q tests/test_core_funding_inclusion_pinned.py \
            --basetemp=tmp/pytest-ci-funding-inclusion
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - name: Prepare verified merchant diagnostic toolchain
        run: |
          python - <<'PY'
          import hashlib, pathlib, shutil
          source = pathlib.Path(shutil.which("bun"))
          assert hashlib.sha256(source.read_bytes()).hexdigest() == "6d5bb405b1d037a2a466b92757de7e47e4369930fa94bd42f8ff44ba49de6c57"
          target = pathlib.Path("../tmp/toolchains/bun-v1.3.11/bun")
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, target)
          target.chmod(0o755)
          PY
          bun install --cwd ../rill-payments --frozen-lockfile --ignore-scripts
      - name: Check funded merchant HTTPS source provenance
        run: |
          RILLSWAP_RUN_BUN_MERCHANT=1 .venv/bin/python -m pytest -q \
            tests/test_merchant_source_pinned.py::test_pinned_https_merchant_source_credit_provenance \
            --basetemp=tmp/pytest-ci-merchant-proof
      - name: Check bound merchant HTTPS admission and durable acceptance
        run: |
          RILLSWAP_RUN_BUN_MERCHANT=1 .venv/bin/python -m pytest -q \
            tests/test_merchant_https_admission_pinned.py::test_pinned_https_native_admission_and_bound_acceptance \
            --basetemp=tmp/pytest-ci-merchant-admission
      - name: Check owned merchant accounting and original reverse receipt
        run: |
          RILLSWAP_RUN_BUN_MERCHANT=1 .venv/bin/python -m pytest -q \
            tests/test_merchant_conversion_pinned.py::test_pinned_merchant_source_to_original_owned_btc_receipt \
            --basetemp=tmp/pytest-ci-merchant-conversion
      - name: Check explicit verified regtest conversion completion
        run: |
          RILLSWAP_RUN_BUN_MERCHANT=1 .venv/bin/python -m pytest -q \
            tests/test_merchant_conversion_pinned.py::test_pinned_explicit_verified_merchant_conversion_completion \
            --basetemp=tmp/pytest-ci-merchant-completion
      - name: Check completion process death at both commit boundaries
        run: |
          RILLSWAP_RUN_BUN_MERCHANT=1 .venv/bin/python -m pytest -q \
            tests/test_merchant_conversion_pinned.py::test_pinned_verified_completion_process_death \
            --basetemp=tmp/pytest-ci-merchant-crash
      - name: Check same-wallet source daemon restart before reconciliation
        run: |
          RILLSWAP_RUN_BUN_MERCHANT=1 .venv/bin/python -m pytest -q \
            tests/test_merchant_conversion_pinned.py::test_pinned_source_daemon_restart_before_verified_completion \
            --basetemp=tmp/pytest-ci-merchant-restart
      - name: Check operator reconciliation, status and original funding hints
        run: |
          RILLSWAP_RUN_BUN_MERCHANT=1 .venv/bin/python -m pytest -q \
            tests/test_merchant_conversion_pinned.py::test_pinned_operator_cli_verified_completion \
            tests/test_merchant_conversion_pinned.py::test_pinned_original_sdk_retains_encrypted_funding_inclusion_before_claim \
            tests/test_merchant_conversion_pinned.py::test_pinned_operator_cli_reconciles_original_saved_funding_hint \
            tests/test_merchant_sdk_death_pinned.py::test_pinned_original_sdk_death_before_claim_recovers_with_original_keys \
            tests/test_merchant_sdk_fallback_death_pinned.py::test_pinned_original_sdk_death_after_signed_fallback_recovers_with_original_keys \
            tests/test_merchant_sdk_settlement_pinned.py::test_pinned_original_sdk_awaits_actual_wallet_claim_depth_three \
            tests/test_merchant_conversion_settlement_pinned.py::test_pinned_public_conversion_observes_signed_claim_depth_with_original_wallet \
            --basetemp=tmp/pytest-ci-treasury-cli

  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rill-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.7'
      - name: Install version-pinned CLI development dependencies
        run: |
          mkdir -p tmp
          uv venv --python 3.14 tmp/ci-venv
          uv pip install --python tmp/ci-venv/bin/python -r requirements-dev.txt
      - name: Check recovery CLI source without opt-in backends
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: src:../rill-core/packages/core/src:../rill-crypto/python/src:../rill-provider/src
        run: |
          tmp/ci-venv/bin/ruff check src tests
          tmp/ci-venv/bin/mypy src
          tmp/ci-venv/bin/python -m pytest -q \
            -m 'not native_crypto and not bitcoin_core and not age_interop' \
            --basetemp=tmp/pytest-ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - name: Check leaf-pinned Python reader against isolated merchant HTTPS
        working-directory: rill-payments
        run: |
          bun install --frozen-lockfile --ignore-scripts
          RILLSWAP_MERCHANT_READER_PYTHON="$PWD/../rill-cli/tmp/ci-venv/bin/python" \
            bun test tests/regtestMerchantHttpsDiagnostic.test.ts
      - name: Build checksum-pinned native crypto dependency
        run: |
          cmake -S ../rill-crypto -B tmp/native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build tmp/native --parallel 2
      - name: Check native live swap against the provider service
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: src:../rill-core/packages/core/src:../rill-crypto/python/src:../rill-provider/src
          RILLSWAP_RUN_NATIVE_CRYPTO: '1'
        run: |
          RILL_CRYPTO_LIBRARY="$PWD/tmp/native/librill_crypto.so" \
            tmp/ci-venv/bin/python -m pytest -q -m native_crypto --basetemp=tmp/pytest-ci-native
      - name: Check historical wallet recognition against pinned Core
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: src:../rill-core/packages/core/src:../rill-crypto/python/src:../rill-provider/src
          RILLSWAP_RUN_BITCOIN_CORE: '1'
        run: |
          tmp/ci-venv/bin/python -m pytest -q tests/test_wallet_history_pinned.py \
            --basetemp=tmp/pytest-ci-wallet-history

  dev-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Check the dev stack's static invariants
        run: |
          docker compose -f dev/compose.yaml config -q
          python -m pip install httpx==0.28.1 pytest==9.1.1
          python -m pytest -q dev/tests

  dev-stack-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the regtest dev stack
        run: dev/devctl up
      - name: Swap in both directions through the real relay
        run: dev/devctl smoke
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f dev/compose.yaml logs --tail=200
